[package]
name = "cerveau"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Box-side client for the Cerveau MCP (gb.run.v1 / gb.turn.v1)"
repository = "https://github.com/danielfebrero/grok-bot-cerveau"
readme = "README.md"
keywords = ["mcp", "ed25519", "x25519"]
categories = ["cryptography", "command-line-utilities"]

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "precomputed-tables"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
fs2 = "0.4"
hex = "0.4"
hkdf = "0.12"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ulid = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
